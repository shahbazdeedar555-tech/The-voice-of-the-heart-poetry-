
<!DOCTYPE html>
<html lang="sd" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ٻيون — اَحساسَن جو ويسُ ڪَويتا</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff8e7, #f8e8c8, #fffdf5);
      color: #4b2e1f;
    }

    header {
      text-align: center;
      padding: 25px 15px 15px;
    }

    h1 {
      color: #7b1e1e;
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      margin-top: 8px;
      color: #6d4c41;
      font-size: 18px;
    }

    .back {
      display: inline-block;
      margin: 15px auto;
      padding: 10px 20px;
      background: #7b1e1e;
      color: white;
      text-decoration: none;
      border-radius: 25px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #d7b889;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(80, 40, 10, 0.12);
    }

    .card h2 {
      color: #7b1e1e;
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #6d3b27;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #c9a46a;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      font-size: 17px;
      background: #fffdf8;
    }

    textarea {
      min-height: 280px;
      line-height: 2;
      resize: vertical;
    }

    .save-btn {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: #7b1e1e;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .save-btn:hover {
      background: #9b2929;
    }

    .poetry-item {
      background: #fffdf5;
      border: 1px solid #d7b889;
      border-radius: 18px;
      padding: 20px;
      margin-top: 18px;
    }

    .poetry-item h3 {
      color: #7b1e1e;
      margin-top: 0;
      text-align: center;
    }

    .poet-name {
      color: #8b4513;
      font-weight: bold;
      line-height: 1.8;
    }

    .poem-text {
      white-space: pre-wrap;
      line-height: 2;
      font-size: 18px;
      margin-top: 15px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .actions button {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 16px;
    }

    .edit-btn {
      background: #b98242;
      color: white;
    }

    .delete-btn {
      background: #8b1e1e;
      color: white;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      text-align: center;
      background: #6d3b27;
      color: white;
    }

    footer a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
    }
  </style>
</head>

<body>

  <header>

    <h1>📝 ٻيون</h1>

    <div class="subtitle">
      Other — اَحساسَن جو ويسُ ڪَويتا
    </div>

    <div>
      <a href="index.html" class="back">
        ← Homepage ڏانهن واپس
      </a>
    </div>

  </header>


  <main class="container">

    <section class="card">

      <h2>✍️ نئين شاعري لکو</h2>

      <label for="poetName">
        نالو
      </label>

      <input
        type="text"
        id="poetName"
        placeholder="شاعر جو نالو"
      >

      <label for="penName">
        تخلص
      </label>

      <input
        type="text"
        id="penName"
        placeholder="تخلص"
      >

      <label for="category">
        صنف
      </label>

      <input
        type="text"
        id="category"
        value="ٻيون"
        readonly
      >

      <label for="poemText">
        شاعري
      </label>

      <textarea
        id="poemText"
        placeholder="هتي پنهنجي شاعري لکو..."
      ></textarea>

      <button
        class="save-btn"
        onclick="savePoetry()"
      >
        💾 شاعري محفوظ ڪريو
      </button>

    </section>


    <section class="card">

      <h2>📖 محفوظ ٿيل شاعري</h2>

      <div id="poetryList"></div>

    </section>

  </main>


  <footer>

    <div>
      <a href="index.html">🏠 گهر</a>
      <a href="categories.html">📚 صنفون</a>
      <a href="poets.html">✒️ شاعر</a>
    </div>

    <p>
      اَحساسَن جو ويسُ — ڪَويتا
    </p>

  </footer>


  <script>

    let editingIndex = -1;


    function getPoetry() {

      return JSON.parse(
        localStorage.getItem("otherPoetry") || "[]"
      );

    }


    function savePoetry() {

      const poetName =
        document.getElementById("poetName").value.trim();

      const penName =
        document.getElementById("penName").value.trim();

      const category =
        document.getElementById("category").value.trim();

      const poemText =
        document.getElementById("poemText").value.trim();


      if (!poetName || !poemText) {

        alert("مهرباني ڪري نالو ۽ شاعري ضرور لکو.");

        return;

      }


      let poetry = getPoetry();


      const poem = {

        poetName: poetName,

        penName: penName,

        category: category,

        text: poemText

      };


      if (editingIndex === -1) {

        poetry.push(poem);

      } else {

        poetry[editingIndex] = poem;

        editingIndex = -1;

      }


      localStorage.setItem(
        "otherPoetry",
        JSON.stringify(poetry)
      );


      clearForm();

      displayPoetry();

    }


    function displayPoetry() {

      const list =
        document.getElementById("poetryList");

      const poetry = getPoetry();


      if (poetry.length === 0) {

        list.innerHTML =
          '<div class="empty">اڃا تائين ڪا شاعري محفوظ ناهي.</div>';

        return;

      }


      list.innerHTML = "";


      poetry.forEach(function(poem, index) {

        const item =
          document.createElement("div");

        item.className = "poetry-item";


        item.innerHTML = `

          <h3>
            📝 ٻيون
          </h3>

          <div class="poet-name">

            نالو:
            ${escapeHTML(poem.poetName)}

            ${
              poem.penName
              ? "<br>تخلص: " + escapeHTML(poem.penName)
              : ""
            }

            <br>

            صنف:
            ${escapeHTML(poem.category)}

          </div>

          <div class="poem-text">
            ${escapeHTML(poem.text)}
          </div>

          <div class="actions">

            <button
              class="edit-btn"
              onclick="editPoetry(${index})"
            >
              ✏️ Edit
            </button>

            <button
              class="delete-btn"
              onclick="deletePoetry(${index})"
            >
              🗑️ Delete
            </button>

          </div>

        `;


        list.appendChild(item);

      });

    }


    function editPoetry(index) {

      const poetry = getPoetry();

      const poem = poetry[index];


      document.getElementById("poetName").value =
        poem.poetName;

      document.getElementById("penName").value =
        poem.penName;

      document.getElementById("category").value =
        poem.category;

      document.getElementById("poemText").value =
        poem.text;


      editingIndex = index;


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function deletePoetry(index) {

      if (
        !confirm("ڇا توهان واقعي هي شاعري Delete ڪرڻ چاهيو ٿا؟")
      ) {

        return;

      }


      const poetry = getPoetry();

      poetry.splice(index, 1);


      localStorage.setItem(
        "otherPoetry",
        JSON.stringify(poetry)
      );


      displayPoetry();

    }


    function clearForm() {

      document.getElementById("poetName").value = "";

      document.getElementById("penName").value = "";

      document.getElementById("category").value = "ٻيون";

      document.getElementById("poemText").value = "";

    }


    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    displayPoetry();

  </script>

</body>

</html>
