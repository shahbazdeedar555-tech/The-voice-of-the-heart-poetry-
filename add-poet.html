
<!DOCTYPE html>
<html lang="sd">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>نئون شاعر شامل ڪريو — ڪَويتا</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf0;
      color: #3b2414;
      direction: rtl;
    }

    header {
      background: linear-gradient(
        135deg,
        #6b2d2d,
        #a0522d
      );

      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 18px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 15px 40px;
    }

    .box {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow:
        0 4px 15px rgba(0,0,0,0.10);

      border: 1px solid #e2c9a5;
    }

    h2 {
      text-align: center;
      color: #6b2d2d;
      margin-top: 0;
    }

    .english-title {
      text-align: center;
      color: #8b4513;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #5b321c;
    }

    input,
    select,
    textarea {

      width: 100%;

      box-sizing: border-box;

      padding: 12px;

      border:
        1px solid #c9a77a;

      border-radius: 9px;

      font-size: 16px;

      background: #fffdf8;
    }

    input:focus,
    select:focus,
    textarea:focus {

      outline: none;

      border-color: #8b4513;
    }

    textarea {

      min-height: 130px;

      resize: vertical;

      line-height: 1.9;
    }

    .save-btn {

      width: 100%;

      margin-top: 28px;

      padding: 14px;

      border: none;

      border-radius: 10px;

      background: #6b2d2d;

      color: white;

      font-size: 18px;

      cursor: pointer;
    }

    .save-btn:hover {

      background: #8b4513;
    }

    .back-btn {

      display: block;

      text-align: center;

      margin-top: 22px;

      color: #6b2d2d;

      text-decoration: none;

      font-size: 17px;
    }

    .note {

      margin-top: 22px;

      padding: 15px;

      background: #fff7df;

      border-right:
        5px solid #d4a373;

      border-radius: 8px;

      line-height: 1.9;

      font-size: 15px;
    }

    footer {

      background: #3b2414;

      color: white;

      text-align: center;

      padding: 18px;

      font-size: 15px;
    }

  </style>

</head>


<body>


<header>

  <h1>
    اَحساسَن جو ويسُ — ڪَويتا
  </h1>

  <p>
    Poetry — The Language of Feelings
  </p>

</header>


<div class="container">

  <div class="box">

    <h2>
      نئون شاعر شامل ڪريو
    </h2>

    <div class="english-title">
      Add New Poet
    </div>


    <form id="poetForm">


      <!-- شاعر جو نالو -->

      <label for="name">
        شاعر جو نالو
      </label>

      <input
        type="text"
        id="name"
        placeholder="مثال: عبدالڪريم"
        required>


      <!-- English Name -->

      <label for="englishName">
        Poet Name in English
      </label>

      <input
        type="text"
        id="englishName"
        placeholder="Example: Abdul Karim">


      <!-- تخلص -->

      <label for="penName">
        تخلص
      </label>

      <input
        type="text"
        id="penName"
        placeholder="مثال: ديـدار">


      <!-- شاعري جو قسم -->

      <label for="poetryType">
        شاعريءَ جو قسم
      </label>

      <select
        id="poetryType"
        required>

        <option value="">
          چونڊيو
        </option>

        <option value="غزل — Ghazal">
          غزل — Ghazal
        </option>

        <option value="گيت — Geet">
          گيت — Geet
        </option>

        <option value="نظم — Nazam">
          نظم — Nazam
        </option>

        <option value="بيت — Bet">
          بيت — Bet
        </option>

        <option value="سترنگو — Satrango">
          سترنگو — Satrango
        </option>

        <option value="وائي — Waai">
          وائي — Waai
        </option>

        <option value="نثري نظم — Nasri Nazam">
          نثري نظم — Nasri Nazam
        </option>

        <option value="تجريدي نظم — Tajredi Nazam">
          تجريدي نظم — Tajredi Nazam
        </option>

        <option value="هائيڪو — Haiku">
          هائيڪو — Haiku
        </option>

        <option value="ٻيا — Other">
          ٻيا — Other
        </option>

      </select>


      <!-- تعارف -->

      <label for="bio">
        شاعر بابت مختصر تعارف
      </label>

      <textarea
        id="bio"
        placeholder="شاعر بابت مختصر تعارف لکو...">
      </textarea>


      <!-- ڄمڻ -->

      <label for="birth">
        ڄمڻ جي تاريخ / سال
      </label>

      <input
        type="text"
        id="birth"
        placeholder="مثال: 1985 يا 12-05-1985">


      <!-- شهر -->

      <label for="place">
        شهر / ڳوٺ
      </label>

      <input
        type="text"
        id="place"
        placeholder="مثال: شاهپور چاڪر">


      <!-- تصوير -->

      <label for="photo">
        شاعر جي تصوير
      </label>

      <input
        type="file"
        id="photo"
        accept="image/*">


      <!-- Social -->

      <label for="social">
        Facebook / Social Link
      </label>

      <input
        type="url"
        id="social"
        placeholder="https://...">


      <!-- Save -->

      <button
        type="submit"
        class="save-btn">

        💾 شاعر محفوظ ڪريو

      </button>


    </form>


    <!-- واپس -->

    <a
      href="poets.html"
      class="back-btn">

      ← شاعرن ڏانهن واپس

    </a>


    <!-- نوٽ -->

    <div class="note">

      <strong>نوٽ:</strong>

      هي صفحو صرف نون شاعرن کي شامل ڪرڻ لاءِ آهي.

      شيخ اياز ۽ شاهه لطيف جهڙن اڳ ۾ موجود شاعرن
      جي صفحن کي هتان تبديل نه ڪيو ويندو.

    </div>


  </div>

</div>


<footer>

  © 2026 ڪَويتا — Poetry App

</footer>



<script>


  const form =
    document.getElementById("poetForm");


  form.addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      /* شاعر جي معلومات */

      const name =
        document
        .getElementById("name")
        .value
        .trim();


      const englishName =
        document
        .getElementById("englishName")
        .value
        .trim();


      const penName =
        document
        .getElementById("penName")
        .value
        .trim();


      const poetryType =
        document
        .getElementById("poetryType")
        .value;


      const bio =
        document
        .getElementById("bio")
        .value
        .trim();


      const birth =
        document
        .getElementById("birth")
        .value
        .trim();


      const place =
        document
        .getElementById("place")
        .value
        .trim();


      const social =
        document
        .getElementById("social")
        .value
        .trim();


      const photoFile =
        document
        .getElementById("photo")
        .files[0];



      /*
       * شاعر محفوظ ڪرڻ
       */

      function savePoet(photoData) {


        const poets =
          JSON.parse(
            localStorage.getItem("poets")
            || "[]"
          );


        const newPoet = {

          name: name,

          englishName:
            englishName,

          penName:
            penName,

          poetryType:
            poetryType,

          bio:
            bio,

          birth:
            birth,

          place:
            place,

          photo:
            photoData || "",

          social:
            social,

          createdAt:
            new Date().toISOString()

        };


        /*
         * نئون شاعر شامل ڪريو
         */

        poets.push(newPoet);


        /*
         * محفوظ ڪريو
         */

        localStorage.setItem(
          "poets",
          JSON.stringify(poets)
        );


        /*
         * نئين شاعر جو نمبر
         */

        const poetIndex =
          poets.length - 1;


        /*
         * شاعري لکڻ واري پيج ڏانهن وڃو
         */

        window.location.href =
          "write-poetry.html?poet="
          + poetIndex;

      }



      /*
       * تصوير موجود هجي
       */

      if (photoFile) {


        const reader =
          new FileReader();


        reader.onload =
          function() {

            savePoet(
              reader.result
            );

          };


        reader.readAsDataURL(
          photoFile
        );


      }


      /*
       * تصوير موجود نه هجي
       */

      else {

        savePoet("");

      }

    }

  );

</script>


</body>

</html>
