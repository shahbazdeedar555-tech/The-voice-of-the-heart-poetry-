

<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#183b2b">

  <title>ڪهاڻي — اَحساسَن جو ويسُ ڪَويتا</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f4ead5;
      color: #183b2b;
      line-height: 1.9;
    }

    header {
      text-align: center;
      background: #183b2b;
      color: #f4ead5;
      padding: 24px 14px;
      border-radius: 16px;
      border-bottom: 5px solid #c9a44c;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
    }

    a, button {
      display: inline-block;
      background: #183b2b;
      color: #fff;
      border: 1px solid #c9a44c;
      border-radius: 9px;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
    }

    main {
      max-width: 800px;
      margin: auto;
    }

    .panel {
      background: #fffaf0;
      border: 1px solid #d8c79f;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px #183b2b12;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 5px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      font-family: inherit;
      font-size: 18px;
      color: #183b2b;
      background: #fff;
      border: 1px solid #b9a777;
      border-radius: 8px;
    }

    textarea {
      min-height: 260px;
      resize: vertical;
      line-height: 2;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
    }

    .delete {
      background: #7b2828;
    }

    .cancel {
      background: #655a45;
    }

    .story-card {
      background: #fffaf0;
      border: 1px solid #d8c79f;
      border-right: 5px solid #c9a44c;
      border-radius: 12px;
      padding: 16px;
      margin: 14px 0;
    }

    .story-card h3 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .story-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 18px;
      line-height: 2.1;
    }

    .empty {
      text-align: center;
      padding: 18px;
      color: #655a45;
    }

    footer {
      text-align: center;
      margin: 24px 0 10px;
      font-size: 14px;
      color: #655a45;
    }
  </style>
</head>

<body>
  <header>
    <h1>📖 ڪهاڻي</h1>
    <p>اَحساسَن جو ويسُ — ڪَويتا</p>
    <p>لفظن ۾ زندگي، ڪردارن ۾ احساس</p>
  </header>

  <nav>
    <a href="index.html">🏠 مکيه صفحو</a>
    <a href="other.html">🌸 ٻيون شاعري</a>
  </nav>

  <main>
    <section class="panel">
      <h2>✍️ پنهنجي ڪهاڻي لکو</h2>

      <label for="storyTitle">ڪهاڻيءَ جو عنوان</label>
      <input
        id="storyTitle"
        type="text"
        maxlength="200"
        placeholder="ڪهاڻيءَ جو عنوان لکو..."
      >

      <label for="storyText">ڪهاڻي</label>
      <textarea
        id="storyText"
        placeholder="پنهنجي ڪهاڻي هتي لکو..."
      ></textarea>

      <div class="buttons">
        <button id="saveBtn" type="button">💾 ڪهاڻي محفوظ ڪريو</button>
        <button id="cancelBtn" class="cancel" type="button" hidden>
          رد ڪريو
        </button>
      </div>
    </section>

    <section class="panel">
      <h2>📚 محفوظ ڪيل ڪهاڻيون</h2>
      <p id="count">ڪهاڻين جو تعداد: 0</p>
      <div id="storyList"></div>
    </section>
  </main>

  <footer>
    <p>اَحساسَن جو ويسُ — ڪَويتا</p>
    <p>ايجاد: ديدار شھباز</p>
  </footer>

  <script>
    const STORAGE_KEY = "ahsasan_jo_wes_story_v1";

    const titleInput = document.getElementById("storyTitle");
    const textInput = document.getElementById("storyText");
    const saveBtn = document.getElementById("saveBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const storyList = document.getElementById("storyList");
    const count = document.getElementById("count");

    let stories = [];
    let editingId = null;

    function normalize(value) {
      return value.normalize("NFC").replace(/\s+/g, " ").trim();
    }

    function loadStories() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        const parsed = saved ? JSON.parse(saved) : [];

        if (!Array.isArray(parsed)) {
          throw new Error("Invalid saved data");
        }

        stories = parsed;
        renderStories();
      } catch (error) {
        storyList.textContent =
          "ڪهاڻيون پڙهڻ ۾ مسئلو ٿيو. برائوزر جي اسٽوريج چيڪ ڪريو.";
        alert("پراڻي ڊيٽا کي پاڻمرادو ختم نه ڪيو ويو آهي.");
      }
    }

    function persistStories() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stories));
        return true;
      } catch (error) {
        alert("ڪهاڻي محفوظ نه ٿي سگهي. فون جي اسٽوريج چيڪ ڪريو.");
        return false;
      }
    }

    function resetForm() {
      titleInput.value = "";
      textInput.value = "";
      editingId = null;
      saveBtn.textContent = "💾 ڪهاڻي محفوظ ڪريو";
      cancelBtn.hidden = true;
    }

    function renderStories() {
      storyList.replaceChildren();
      count.textContent = "ڪهاڻين جو تعداد: " + stories.length;

      if (stories.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "اڃا ڪا ڪهاڻي محفوظ نه ڪئي وئي آهي.";
        storyList.appendChild(empty);
        return;
      }

      [...stories].reverse().forEach(function(story) {
        const card = document.createElement("article");
        card.className = "story-card";

        const heading = document.createElement("h3");
        heading.textContent = story.title || "بغير عنوان جي ڪهاڻي";

        const content = document.createElement("div");
        content.className = "story-text";
        content.textContent = story.text;

        const buttons = document.createElement("div");
        buttons.className = "buttons";

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.textContent = "✏️ ترميم";
        editBtn.addEventListener("click", function() {
          titleInput.value = story.title;
          textInput.value = story.text;
          editingId = story.id;
          saveBtn.textContent = "💾 تبديليون محفوظ ڪريو";
          cancelBtn.hidden = false;
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "delete";
        deleteBtn.textContent = "🗑️ ختم ڪريو";
        deleteBtn.addEventListener("click", function() {
          if (!confirm("ڇا اوهان هي ڪهاڻي ختم ڪرڻ چاهيو ٿا؟")) {
            return;
          }

          const oldStories = stories;
          stories = stories.filter(function(item) {
            return item.id !== story.id;
          });

          if (persistStories()) {
            renderStories();

            if (editingId === story.id) {
              resetForm();
            }
          } else {
            stories = oldStories;
          }
        });

        buttons.append(editBtn, deleteBtn);
        card.append(heading, content, buttons);
        storyList.appendChild(card);
      });
    }

    saveBtn.addEventListener("click", function() {
      const title = titleInput.value.trim();
      const text = textInput.value.trim();

      if (!text) {
        alert("مهرباني ڪري پهرين پنهنجي ڪهاڻي لکو.");
        textInput.focus();
        return;
      }

      const duplicate = stories.some(function(story) {
        return story.id !== editingId &&
          normalize(story.text) === normalize(text);
      });

      if (duplicate) {
        alert("هي ڪهاڻي هن صفحي ۾ اڳ ئي محفوظ ٿيل آهي.");
        return;
      }

      const oldStories = stories.map(function(story) {
        return { ...story };
      });

      if (editingId !== null) {
        stories = stories.map(function(story) {
          return story.id === editingId
            ? { ...story, title: title, text: text }
            : story;
        });
      } else {
        stories.push({
          id: Date.now().toString() + Math.random().toString(36).slice(2),
          title: title,
          text: text
        });
      }

      if (persistStories()) {
        renderStories();
        resetForm();
        alert("ڪهاڻي ڪاميابيءَ سان محفوظ ٿي وئي.");
      } else {
        stories = oldStories;
      }
    });

    cancelBtn.addEventListener("click", resetForm);

    loadStories();
  </script>
</body>
</html>
