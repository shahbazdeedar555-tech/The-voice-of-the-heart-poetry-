
<!DOCTYPE html>
<html lang="sd" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شاعر جي شاعري — اَحساسَن جو ويسُ ڪَويتا</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff8e7, #f8e6c4);
      color: #4a2c1a;
    }

    header {
      background: linear-gradient(135deg, #7b1e1e, #b8860b);
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 18px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .back {
      display: inline-block;
      background: #7b1e1e;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .poet-box {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      margin-bottom: 25px;
      text-align: center;
    }

    .poet-icon {
      font-size: 45px;
    }

    .poet-name {
      font-size: 28px;
      color: #7b1e1e;
      margin: 10px 0;
    }

    .takhalus {
      font-size: 19px;
      color: #8b6508;
    }

    .address {
      margin-top: 10px;
      color: #555;
    }

    .poetry-card {
      background: #fffdf8;
      border: 2px solid #d4af37;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .poetry-title {
      color: #7b1e1e;
      text-align: center;
      font-size: 25px;
      margin-bottom: 20px;
    }

    .poetry-text {
      white-space: pre-line;
      line-height: 2.2;
      font-size: 21px;
      text-align: right;
      min-height: 100px;
    }

    .edit-area {
      display: none;
      width: 100%;
      min-height: 250px;
      padding: 15px;
      font-family: inherit;
      font-size: 19px;
      line-height: 2;
      border: 2px solid #d4af37;
      border-radius: 10px;
      resize: vertical;
      direction: rtl;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      border: none;
      padding: 11px 22px;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .edit-btn {
      background: #8b6508;
    }

    .save-btn {
      background: #198754;
      display: none;
    }

    .delete-btn {
      background: #b02a37;
    }

    .cancel-btn {
      background: #555;
      display: none;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 15px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>اَحساسَن جو ويسُ — ڪَويتا</h1>
    <p>Poetry — The Language of Feelings</p>
  </header>

  <div class="container">

    <a class="back" href="poets.html">← شاعرن ڏانهن واپس</a>

    <div class="poet-box">
      <div class="poet-icon">🪶</div>

      <div class="poet-name" id="poetName">
        ديدار علي
      </div>

      <div class="takhalus">
        تخلص: <span id="poetTakhalus">شاهباز</span>
      </div>

      <div class="address">
        📍 <span id="poetAddress">Post Office Karam Khan Nizamani</span>
      </div>
    </div>

    <div id="poetryContainer"></div>

  </div>

  <script>

    /*
      شاعري هتي محفوظ ٿيندي.
      نئون شعر شامل ڪرڻ لاءِ هيٺ poetryData ۾ نئون object وڌايو.
    */

    let poetryData = JSON.parse(localStorage.getItem("poetryData")) || [
      {
        id: Date.now(),
        category: "غزل — Ghazal",
        text:
`تنهنجي ياد ۾ دل اڄ به ڌڙڪي ٿي،
تنهنجي نالي سان هر خوشي جڙڪي ٿي۔

لفظن ۾ تنهنجو ذڪر جڏهن اچي ٿو،
دل جي دنيا وري روشن ٿي وڃي ٿي۔`
      }
    ];

    function showPoetry() {

      const container = document.getElementById("poetryContainer");

      container.innerHTML = "";

      if (poetryData.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <h2>هن شاعر جي شاعري موجود ناهي.</h2>
          </div>
        `;
        return;
      }

      poetryData.forEach((poem, index) => {

        const card = document.createElement("div");
        card.className = "poetry-card";

        card.innerHTML = `

          <div class="poetry-title">
            ${poem.category}
          </div>

          <div class="poetry-text" id="text-${poem.id}">
            ${escapeHTML(poem.text)}
          </div>

          <textarea
            class="edit-area"
            id="edit-${poem.id}"
          >${poem.text}</textarea>

          <div class="buttons">

            <button
              class="edit-btn"
              onclick="editPoetry(${poem.id})">
              ✏️ Edit
            </button>

            <button
              class="save-btn"
              id="save-${poem.id}"
              onclick="savePoetry(${poem.id})">
              💾 Save
            </button>

            <button
              class="cancel-btn"
              id="cancel-${poem.id}"
              onclick="cancelEdit(${poem.id})">
              ❌ Cancel
            </button>

            <button
              class="delete-btn"
              onclick="deletePoetry(${poem.id})">
              🗑️ Delete
            </button>

          </div>
        `;

        container.appendChild(card);
      });
    }


    function editPoetry(id) {

      document.getElementById("text-" + id).style.display = "none";

      document.getElementById("edit-" + id).style.display = "block";

      document.getElementById("save-" + id).style.display = "inline-block";

      document.getElementById("cancel-" + id).style.display = "inline-block";

      event.target.style.display = "none";
    }


    function savePoetry(id) {

      const textarea = document.getElementById("edit-" + id);

      const newText = textarea.value.trim();

      if (newText === "") {
        alert("شاعري خالي نه رکو.");
        return;
      }

      const poem = poetryData.find(p => p.id === id);

      if (poem) {
        poem.text = newText;
      }

      localStorage.setItem(
        "poetryData",
        JSON.stringify(poetryData)
      );

      showPoetry();
    }


    function cancelEdit(id) {
      showPoetry();
    }


    function deletePoetry(id) {

      const confirmDelete = confirm(
        "ڇا توهان واقعي هي شاعري Delete ڪرڻ چاهيو ٿا؟"
      );

      if (!confirmDelete) {
        return;
      }

      poetryData = poetryData.filter(
        poem => poem.id !== id
      );

      localStorage.setItem(
        "poetryData",
        JSON.stringify(poetryData)
      );

      showPoetry();
    }


    function escapeHTML(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }


    showPoetry();

  </script>

</body>
</html>
