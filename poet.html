  <style>

      background: #f5eedc;

      line-height: 1.8;
    }

    header {
      background: #173f32;
      color: #f3d27a;

    header h1 {

    .container {

    .back {

      text-decoration: none;
      color: #173f32;

      border: 1px solid #d7bd76;

    .poet-icon {
      font-size: 45px;
      margin-bottom: 5px;

      font-size: 25px;
    }

    .poet-card .takhallus {
      color: #8b6a1d;
      font-weight: bold;
      font-size: 17px;
    }

    .poet-card .address {
      color: #555;
      margin: 8px 0;
      font-size: 15px;
    }

    .poetry-type {
      color: #173f32;
      font-weight: bold;
      margin: 8px 0 15px;
    }

    .poetry-btn {
      display: inline-block;
      text-decoration: none;
      background: #173f32;
      color: #f3d27a;
      padding: 10px 22px;
      border-radius: 25px;
      font-weight: bold;
      transition: 0.2s;
    }

    .poetry-btn:hover {
      background: #245947;
      transform: translateY(-2px);
    }

    footer {
      background: #173f32;
      color: #f3d27a;
      text-align: center;
      padding: 20px 10px;
      margin-top: 30px;
    }

    footer p {
      margin: 3px 0;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 24px;
      }
