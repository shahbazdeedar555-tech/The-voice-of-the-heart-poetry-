
<!DOCTYPE html>
<html lang="sd" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بيت — اَحساسَن جو ويسُ ڪَويتا</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff8e7, #f8e8c8, #fffdf5);
      color: #4b2e1f;
    }

    header {
      text-align: center;
      padding: 25px 15px 15px;
    }

    h1 {
      color: #7b1e1e;
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      margin-top: 8px;
      color: #6d4c41;
      font-size: 18px;
    }

    .back {
      display: inline-block;
      margin: 15px auto;
      padding: 10px 20px;
      background: #7b1e1e;
      color: white;
      text-decoration: none;
      border-radius: 25px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #d7b889;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(80, 40, 10, 0.12);
    }

    .card h2 {
      color: #7b1e1e;
      margin-top: 0;
      text-align: center;
    }

    textarea, input {
      display: block;
      width: 100%;
      padding: 15px;
      border: 1px solid #c9a46a;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      background: #fffdf8;
    }

    textarea {
      min-height: 320px;
      line-height: 2;
      resize: vertical;
    }

    .save-btn {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: #7b1e1e;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .poetry-item {
      background: #fffdf5;
      border: 1px solid #d7b889;
      border-radius: 18px;
      padding: 20px;
      margin-top: 18px;
    }

    .poetry-item h3 {
      color: #7b1e1e;
      margin-top: 0;
      text-align: center;
    }

    .poem-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 2;
      font-size: 18px;
      margin-top: 15px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .actions button {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 16px;
    }

    .edit-btn {
      background: #b98242;
      color: white;
    }

    .delete-btn {
      background: #8b1e1e;
      color: white;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      text-align: center;
      background: #6d3b27;
      color: white;
    }

    footer a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
    }
  </style>
</head>

<body>

  <header>
    <h1>📜 بيت</h1>
    <div class="subtitle">Bet — اَحساسَن جو ويسُ ڪَويتا</div>
    <a href="index.html" class="back">← Homepage ڏانهن واپس</a>
  </header>

  <main class="container">

    <section class="card">
      <h2>✍️ سڌو پنهنجو بيت لکو</h2>

      <input
        type="text"
        id="poemTitle"
        placeholder="عنوان (اختياري)"
        aria-label="بيت جو عنوان"
      >

      <textarea
        id="poemText"
        placeholder="هتي پنهنجو بيت لکو..."
        aria-label="پنهنجو بيت لکو"
      ></textarea>

      <button class="save-btn" onclick="savePoetry()">
        💾 بيت محفوظ ڪريو
      </button>
    </section>

    <section class="card">
      <h2>📖 محفوظ ٿيل بيت</h2>
      <div id="poetryList"></div>
    </section>

  </main>

  <footer>
    <div>
      <a href="index.html">🏠 گهر</a>
      <a href="categories.html">📚 صنفون</a>
      <a href="poets.html">✒️ شاعر</a>
    </div>
    <p>اَحساسَن جو ويسُ — ڪَويتا</p>
  </footer>


<script>
  let editingIndex = -1;

  function getPoetry() {
    try {
      const saved = JSON.parse(
        localStorage.getItem("betPoetry") || "[]"
      );

      return Array.isArray(saved) ? saved : [];
    } catch (error) {
      return [];
    }
  }

  // Normalize text to detect repeated poetry.
  function normalizePoem(text) {
    return String(text || "")
      .normalize("NFC")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }

  // Check whether the same poem exists in any poetry category.
  function findDuplicate(poemText) {
    const target = normalizePoem(poemText);

    if (!target) return null;

    const currentPoetry = getPoetry();

    // Check the current Bet category first.
    for (let i = 0; i < currentPoetry.length; i++) {
      if (
        i !== editingIndex &&
        normalizePoem(currentPoetry[i].text) === target
      ) {
        return {
          category: "بيت",
          title: currentPoetry[i].title || "بيت",
          number: i + 1
        };
      }
    }

    // Check other saved poetry categories.
    const categoryNames = {
      ghazalPoetry: "غزل",
      geetPoetry: "گيت",
      nazamPoetry: "نظم",
      satrangoPoetry: "سترنگو",
      waaiPoetry: "وائي",
      otherPoetry: "ٻي شاعري",
      poetry: "شاعري"
    };

    for (let k = 0; k < localStorage.length; k++) {
      const key = localStorage.key(k);

      if (!key || key === "betPoetry") continue;

      try {
        const data = JSON.parse(localStorage.getItem(key));

        if (!Array.isArray(data)) continue;

        for (let i = 0; i < data.length; i++) {
          const poem = data[i];

          if (
            poem &&
            typeof poem.text === "string" &&
            normalizePoem(poem.text) === target
          ) {
            return {
              category: categoryNames[key] ||
                (poem.category || "ٻي صنف"),
              title: poem.title || "بنا عنوان جي شاعري",
              number: i + 1
            };
          }
        }
      } catch (error) {
        // Ignore unrelated or invalid localStorage entries.
      }
    }

    return null;
  }

  function savePoetry() {
    const poemTitle = document
      .getElementById("poemTitle")
      .value.trim();

    const poemText = document
      .getElementById("poemText")
      .value.trim();

    if (!poemText) {
      alert("مهرباني ڪري پهرين پنهنجو بيت لکو.");
      return;
    }

    // Warn before saving a duplicate.
    const duplicate = findDuplicate(poemText);

    if (duplicate) {
      alert(
        "⚠️ هي بيت اڳ ۾ محفوظ ٿيل آهي!\n\n" +
        "صنف: " + duplicate.category + "\n" +
        "عنوان: " + duplicate.title + "\n" +
        "محفوظ ٿيل نمبر: " + duplicate.number +
        "\n\nساڳيو بيت ٻيهر محفوظ نه ڪيو ويو."
      );
      return;
    }

    const poetry = getPoetry();

    if (editingIndex === -1) {
      poetry.push({
        poetName: "",
        penName: "",
        category: "بيت",
        title: poemTitle || "بيت",
        text: poemText
      });
    } else {
      const oldPoem = poetry[editingIndex];

      if (!oldPoem) {
        alert("هي بيت نه مليو. مهرباني ڪري ٻيهر ڪوشش ڪريو.");
        editingIndex = -1;
        return;
      }

      poetry[editingIndex] = {
        ...oldPoem,
        category: "بيت",
        title: poemTitle || "بيت",
        text: poemText
      };
    }

    try {
      localStorage.setItem(
        "betPoetry",
        JSON.stringify(poetry)
      );
    } catch (error) {
      alert(
        "بيت محفوظ نه ٿي سگهيو. اسٽوريج جي جاءِ چيڪ ڪريو."
      );
      return;
    }

    clearForm();
    displayPoetry();

    alert("✅ توهان جو بيت ڪاميابيءَ سان محفوظ ٿي ويو.");
  }

  function displayPoetry() {
    const list = document.getElementById("poetryList");
    const poetry = getPoetry();

    list.innerHTML = "";

    // Display total count.
    const count = document.createElement("div");
    count.className = "empty";
    count.textContent = "📚 ڪل محفوظ ٿيل بيت: " + poetry.length;
    list.appendChild(count);

    if (poetry.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "اڃا تائين ڪو بيت محفوظ ناهي.";
      list.appendChild(empty);
      return;
    }

    poetry.forEach(function(poem, index) {
      const item = document.createElement("div");
      item.className = "poetry-item";

      // Automatic numbering.
      const number = document.createElement("h3");
      number.textContent = "بيت نمبر " + (index + 1);

      const heading = document.createElement("h3");
      heading.textContent = poem.title || "بيت";

      const text = document.createElement("div");
      text.className = "poem-text";
      text.textContent = poem.text || "";

      const actions = document.createElement("div");
      actions.className = "actions";

      const editButton = document.createElement("button");
      editButton.className = "edit-btn";
      editButton.textContent = "✏️ Edit";
      editButton.onclick = function() {
        editPoetry(index);
      };

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-btn";
      deleteButton.textContent = "🗑️ Delete";
      deleteButton.onclick = function() {
        deletePoetry(index);
      };

      actions.appendChild(editButton);
      actions.appendChild(deleteButton);

      item.appendChild(number);
      item.appendChild(heading);
      item.appendChild(text);
      item.appendChild(actions);

      list.appendChild(item);
    });
  }

  function editPoetry(index) {
    const poetry = getPoetry();
    const poem = poetry[index];

    if (!poem) return;

    document.getElementById("poemTitle").value =
      poem.title || "";

    document.getElementById("poemText").value =
      poem.text || "";

    editingIndex = index;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

    document.getElementById("poemText").focus();
  }

  function deletePoetry(index) {
    if (!confirm("ڇا توهان واقعي هي بيت ختم ڪرڻ چاهيو ٿا؟")) {
      return;
    }

    const poetry = getPoetry();

    if (index < 0 || index >= poetry.length) return;

    poetry.splice(index, 1);

    try {
      localStorage.setItem(
        "betPoetry",
        JSON.stringify(poetry)
      );
    } catch (error) {
      alert("بيت ختم ڪرڻ ۾ مسئلو پيش آيو.");
      return;
    }

    if (editingIndex === index) {
      clearForm();
    } else if (editingIndex > index) {
      editingIndex--;
    }

    displayPoetry();
    alert("بيت ختم ڪيو ويو.");
  }

  function clearForm() {
    document.getElementById("poemTitle").value = "";
    document.getElementById("poemText").value = "";
    editingIndex = -1;
  }

  displayPoetry();
</script>


</body>
</html>
