
<!DOCTYPE html>
<html lang="sd" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شاعري لکو — اَحساسَن جو ويسُ ڪَويتا</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4ead5;
      color: #183b2b;
    }

    header {
      background: #183b2b;
      color: #f4d58d;
      text-align: center;
      padding: 22px 15px;
      border-bottom: 3px solid #c9a44c;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
    }

    header p {
      margin: 8px 0 0;
      color: #fff4d6;
      font-size: 16px;
    }

    .top-buttons {
      text-align: center;
      padding: 18px 10px 5px;
    }

    .top-buttons a {
      display: inline-block;
      text-decoration: none;
      background: #183b2b;
      color: #f4d58d;
      border: 1px solid #c9a44c;
      padding: 10px 16px;
      margin: 5px;
      border-radius: 8px;
      font-weight: bold;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .page-title .icon {
      font-size: 42px;
    }

    .page-title h2 {
      margin: 8px 0;
      font-size: 26px;
    }

    .page-title p {
      margin: 5px 0;
      color: #555;
      direction: ltr;
    }

    .form-card {
      background: #fffaf0;
      border: 2px solid #c9a44c;
      border-radius: 18px;
      padding: 25px 18px;
      box-shadow: 0 4px 12px rgba(24, 59, 43, 0.12);
    }

    .section-heading {
      text-align: center;
      margin: 5px 0 22px;
      font-size: 23px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 17px;
    }

    .optional {
      font-size: 13px;
      color: #777;
      font-weight: normal;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #c9a44c;
      border-radius: 8px;
      background: #fffdf6;
      color: #183b2b;
      font-family: Arial, sans-serif;
      font-size: 17px;
    }

    textarea {
      min-height: 280px;
      resize: vertical;
      line-height: 2;
    }

    .poem-box {
      background: #f8efdf;
      border: 1px solid #c9a44c;
      border-radius: 14px;
      padding: 18px 14px;
      margin-bottom: 18px;
    }

    .poem-box h3 {
      margin-top: 0;
      text-align: center;
      font-size: 20px;
    }

    .remove-button {
      background: #eee0c4;
      color: #183b2b;
      border: 1px solid #c9a44c;
      padding: 8px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-poem,
    .save-button {
      display: block;
      width: 100%;
      background: #183b2b;
      color: #f4d58d;
      border: 1px solid #c9a44c;
      padding: 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
      margin-top: 12px;
    }

    .message {
      display: none;
      text-align: center;
      margin-top: 18px;
      padding: 14px;
      background: #e8dfc9;
      border: 1px solid #c9a44c;
      border-radius: 10px;
      font-weight: bold;
      line-height: 1.8;
    }

    .saved-poem {
      background: #fffdf6;
      border: 1px solid #c9a44c;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    .saved-poem h3 {
      text-align: center;
      overflow-wrap: anywhere;
    }

    .saved-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 2;
      font-size: 18px;
    }

    .saved-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .saved-actions button {
      flex: 1;
      min-width: 110px;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .edit-button {
      background: #b98242;
      color: white;
    }

    .delete-button {
      background: #8b1e1e;
      color: white;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 18px;
    }

    footer {
      background: #183b2b;
      color: #f4d58d;
      text-align: center;
      padding: 20px 10px;
      border-top: 3px solid #c9a44c;
    }

    footer p {
      margin: 5px 0;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 23px;
      }

      .form-card {
        padding: 20px 13px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>اَحساسَن جو ويسُ — ڪَويتا</h1>
    <p>Poetry — The Language of Feelings</p>
  </header>

  <div class="top-buttons">
    <a href="index.html">⌂ گهر</a>
    <a href="categories.html">📖 شاعريءَ جا قسم</a>
    <a href="poets.html">🪶 شاعر</a>
  </div>

  <main class="container">

    <section class="page-title">
      <div class="icon">✍️</div>
      <h2>پنهنجي شاعري لکو</h2>
      <p>Write Your Poetry</p>
    </section>

    <section class="form-card">

      <h2 class="section-heading">✦ شاعري لکو ✦</h2>

      <div id="poemsContainer">

        <div class="poem-box">
          <h3>📖 شاعري 1</h3>

          <div class="field">
            <label>عنوان <span class="optional">(اختياري)</span></label>
            <input
              type="text"
              class="poemTitle"
              placeholder="شاعري جو عنوان">
          </div>

          <div class="field">
            <label>شاعري</label>
            <textarea
              class="poemText"
              placeholder="پنهنجي شاعري هتي لکو..."></textarea>
          </div>
        </div>

      </div>

      <button
        type="button"
        class="add-poem"
        onclick="addPoem()">
        ＋ ٻي شاعري شامل ڪريو
      </button>

      <button
        type="button"
        class="save-button"
        onclick="savePoetry()">
        💾 شاعري محفوظ ڪريو
      </button>

      <div class="message" id="message"></div>

    </section>

    <section class="form-card" style="margin-top:22px;">
      <h2 class="section-heading">📚 محفوظ ٿيل شاعري</h2>
      <div id="savedPoems"></div>
    </section>

  </main>

  <footer>
    <p>اَحساسَن جو ويسُ — ڪَويتا</p>
    <p>Poetry — The Language of Feelings</p>
    <p>© 2026 ايجاد ديدار شھباز</p>
  </footer>

  <script>
    let poemNumber = 1;
    let editingId = null;

    const STORAGE_KEY = "independentPoetry";

    function getPoetry() {
      try {
        const data = JSON.parse(
          localStorage.getItem(STORAGE_KEY) || "[]"
        );

        return Array.isArray(data) ? data : [];
      } catch (error) {
        return [];
      }
    }

    function addPoem() {
      poemNumber++;

      const container =
        document.getElementById("poemsContainer");

      const poemBox = document.createElement("div");
      poemBox.className = "poem-box";

      const heading = document.createElement("h3");
      heading.textContent = "📖 شاعري " + poemNumber;
      poemBox.appendChild(heading);

      const titleField = document.createElement("div");
      titleField.className = "field";

      const titleLabel = document.createElement("label");
      titleLabel.textContent = "عنوان (اختياري)";

      const titleInput = document.createElement("input");
      titleInput.type = "text";
      titleInput.className = "poemTitle";
      titleInput.placeholder = "شاعري جو عنوان";

      titleField.appendChild(titleLabel);
      titleField.appendChild(titleInput);
      poemBox.appendChild(titleField);

      const textField = document.createElement("div");
      textField.className = "field";

      const textLabel = document.createElement("label");
      textLabel.textContent = "شاعري";

      const textArea = document.createElement("textarea");
      textArea.className = "poemText";
      textArea.placeholder = "پنهنجي شاعري هتي لکو...";

      textField.appendChild(textLabel);
      textField.appendChild(textArea);
      poemBox.appendChild(textField);

      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.className = "remove-button";
      removeButton.textContent = "✕ هي خانو ختم ڪريو";
      removeButton.onclick = function() {
        poemBox.remove();
        renumberPoems();
      };

      poemBox.appendChild(removeButton);
      container.appendChild(poemBox);
    }

    function renumberPoems() {
      const boxes = document.querySelectorAll(
        "#poemsContainer .poem-box"
      );

      poemNumber = boxes.length;

      boxes.forEach(function(box, index) {
        box.querySelector("h3").textContent =
          "📖 شاعري " + (index + 1);
      });
    }

    function savePoetry() {
      const boxes = document.querySelectorAll(
        "#poemsContainer .poem-box"
      );

      const newPoems = [];

      boxes.forEach(function(box) {
        const title = box.querySelector(".poemTitle")
          .value.trim();

        const text = box.querySelector(".poemText")
          .value.trim();

        if (text !== "") {
          newPoems.push({
            title: title,
            text: text,
            savedAt: new Date().toISOString()
          });
        }
      });

      if (newPoems.length === 0) {
        alert("مهرباني ڪري پهرين پنهنجي شاعري لکو.");
        return;
      }

      let poetry = getPoetry();

      if (editingId !== null) {
        const index = poetry.findIndex(function(item) {
          return item.id === editingId;
        });

        if (index !== -1) {
          poetry.splice(index, 1);
        }
      }

      newPoems.forEach(function(poem) {
        poem.id =
          Date.now().toString() +
          Math.random().toString(36).slice(2);

        poetry.unshift(poem);
      });

      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(poetry)
        );
      } catch (error) {
        alert(
          "شاعري محفوظ نه ٿي سگهي. مهرباني ڪري برائوزر جي خالي جاءِ چيڪ ڪريو."
        );
        return;
      }

      clearForm();
      displaySavedPoems();

      const message = document.getElementById("message");
      message.textContent =
        "🌹 توهان جي شاعري ڪاميابيءَ سان محفوظ ٿي وئي آهي.";
      message.style.display = "block";
    }

    function displaySavedPoems() {
      const container =
        document.getElementById("savedPoems");

      const poetry = getPoetry();

      container.innerHTML = "";

      if (poetry.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "اڃا تائين ڪا شاعري محفوظ ناهي.";
        container.appendChild(empty);
        return;
      }

      poetry.forEach(function(poem) {
        const item = document.createElement("div");
        item.className = "saved-poem";

        const heading = document.createElement("h3");
        heading.textContent = poem.title || "شاعري";

        const text = document.createElement("div");
        text.className = "saved-text";
        text.textContent = poem.text || "";

        const actions = document.createElement("div");
        actions.className = "saved-actions";

        const editButton = document.createElement("button");
        editButton.className = "edit-button";
        editButton.textContent = "✏️ Edit";
        editButton.onclick = function() {
          editPoetry(poem.id);
        };

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.textContent = "🗑️ Delete";
        deleteButton.onclick = function() {
          deletePoetry(poem.id);
        };

        actions.appendChild(editButton);
        actions.appendChild(deleteButton);

        item.appendChild(heading);
        item.appendChild(text);
        item.appendChild(actions);

        container.appendChild(item);
      });
    }

    function editPoetry(id) {
      const poetry = getPoetry();

      const poem = poetry.find(function(item) {
        return item.id === id;
      });

      if (!poem) return;

      editingId = id;

      const container =
        document.getElementById("poemsContainer");

      container.innerHTML = "";

      poemNumber = 0;
      addPoem();

      container.querySelector(".poemTitle").value =
        poem.title || "";

      container.querySelector(".poemText").value =
        poem.text || "";

      document.querySelector(".save-button").textContent =
        "💾 تبديليون محفوظ ڪريو";

      document.getElementById("message").style.display =
        "none";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function deletePoetry(id) {
      if (!confirm("ڇا توهان هي شاعري ختم ڪرڻ چاهيو ٿا؟")) {
        return;
      }

      const poetry = getPoetry().filter(function(item) {
        return item.id !== id;
      });

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(poetry)
      );

      if (editingId === id) {
        clearForm();
      }

      displaySavedPoems();
    }

    function clearForm() {
      document.getElementById("poemsContainer").innerHTML = "";
      editingId = null;
      poemNumber = 0;
      addPoem();

      document.querySelector(".save-button").textContent =
        "💾 شاعري محفوظ ڪريو";

      document.getElementById("message").style.display =
        "none";
    }

    displaySavedPoems();
  </script>

</body>
</html>
