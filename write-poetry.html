
<!DOCTYPE html>
<html lang="sd" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ڪَويتا — شاعري</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans Arabic", "Segoe UI", sans-serif;
      background:
        linear-gradient(135deg, #fff8e7, #f1dfb8);
      color: #3b2415;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      background:
        linear-gradient(135deg, #741d1d, #b8860b);
      color: white;
      border-radius: 0 0 35px 35px;
      box-shadow: 0 5px 18px rgba(0,0,0,.2);
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      direction: ltr;
      margin: 8px 0 0;
      font-size: 17px;
    }

    .container {
      width: 94%;
      max-width: 850px;
      margin: 25px auto;
    }

    .poet-card {
      background: rgba(255,255,255,.97);
      border: 2px solid #d6b46a;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(70,40,10,.15);
    }

    .poet-name {
      text-align: center;
      color: #741d1d;
      font-size: 30px;
      margin: 0;
    }

    .pen-name {
      text-align: center;
      color: #9b6b18;
      font-size: 18px;
      margin-top: 8px;
    }

    .type {
      text-align: center;
      margin: 15px auto;
      padding: 9px 16px;
      background: #fff2cc;
      border-radius: 20px;
      width: fit-content;
      color: #741d1d;
      font-weight: bold;
    }

    .poem {
      position: relative;
      margin-top: 28px;
      padding: 28px 25px;
      background: #fffdf7;
      border: 1px solid #d7bb7b;
      border-radius: 18px;
      box-shadow: 0 3px 10px rgba(80,50,20,.08);
    }

    .poem::before {
      content: "❝";
      position: absolute;
      top: 5px;
      right: 15px;
      font-size: 42px;
      color: #c29a4c;
    }

    .poem-title {
      text-align: center;
      color: #741d1d;
      font-size: 24px;
      margin: 5px 0 20px;
    }

    .poem-text {
      white-space: pre-line;
      line-height: 2.2;
      font-size: 19px;
      text-align: right;
    }

    .empty {
      text-align: center;
      padding: 40px 15px;
      color: #765333;
      font-size: 18px;
    }

    .back {
      display: block;
      width: 100%;
      max-width: 350px;
      margin: 30px auto 5px;
      padding: 14px;
      text-align: center;
      text-decoration: none;
      background: #ead8ad;
      color: #5b3218;
      border-radius: 14px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #765333;
      font-size: 14px;
    }

    @media(max-width:600px) {

      header h1 {
        font-size: 24px;
      }

      .poet-card {
        padding: 18px;
      }

      .poet-name {
        font-size: 25px;
      }

      .poem {
        padding: 25px 18px;
      }

      .poem-text {
        font-size: 18px;
      }

    }

  </style>

</head>


<body>


<header>

  <h1>
    اَحساسَن جو ويسُ — ڪَويتا
  </h1>

  <p>
    Poetry — The Language of Feelings
  </p>

</header>



<main class="container">

  <section class="poet-card">

    <h2
      id="poetName"
      class="poet-name">
      شاعر
    </h2>

    <div
      id="penName"
      class="pen-name">
    </div>

    <div
      id="poetryType"
      class="type">
    </div>


    <div id="poetryContainer">

      <!-- شاعري هتي ظاهر ٿيندي -->

    </div>


    <a
      href="poets.html"
      class="back">
      ← شاعرن ڏانهن واپس
    </a>

  </section>

</main>



<footer>

  © 2026 ڪَويتا — Poetry App

</footer>



<script>

  /*
    شاعر جي ID URL مان وٺون ٿا

    مثال:
    poetry.html?id=123456
  */

  const params =
    new URLSearchParams(window.location.search);

  const poetId =
    params.get("id");


  /*
    محفوظ ٿيل شاعر
  */

  const poets =
    JSON.parse(
      localStorage.getItem("kavitaNewPoets")
    ) || [];


  /*
    ID مطابق شاعر ڳوليو
  */

  const poet =
    poets.find(
      p => String(p.id) === String(poetId)
    );


  /*
    جيڪڏهن شاعر نه ملي
  */

  if (!poet) {

    document.getElementById("poetName")
      .textContent =
      "شاعر نه مليو";

    document.getElementById("poetryType")
      .style.display = "none";

    document.getElementById("penName")
      .style.display = "none";

    document.getElementById("poetryContainer")
      .innerHTML = `

        <div class="empty">

          هي شاعر اڃا موجود ناهي.

        </div>

      `;

  }


  /*
    شاعر جي معلومات
  */

  else {

    document.getElementById("poetName")
      .textContent =
      poet.name || "شاعر";


    if (poet.penName) {

      document.getElementById("penName")
        .textContent =
        "تخلص: " + poet.penName;

    }

    else {

      document.getElementById("penName")
        .style.display = "none";

    }


    document.getElementById("poetryType")
      .textContent =
      poet.poetryType || "شاعري";


    /*
      شاعري ڏيکاريو
    */

    const container =
      document.getElementById("poetryContainer");


    if (!poet.poems || poet.poems.length === 0) {

      container.innerHTML = `

        <div class="empty">

          هن شاعر جي شاعري اڃا شامل نه ڪئي وئي آهي. 🌹

        </div>

      `;

    }


    else {

      poet.poems.forEach(
        function(poem) {

          const poemBox =
            document.createElement("article");

          poemBox.className = "poem";


          const title =
            document.createElement("h3");

          title.className =
            "poem-title";

          title.textContent =
            poem.title || "بي عنوان شاعري";


          const text =
            document.createElement("div");

          text.className =
            "poem-text";

          text.textContent =
            poem.text || "";


          poemBox.appendChild(title);

          poemBox.appendChild(text);

          container.appendChild(poemBox);

        }
      );

    }

  }

</script>


</body>
</html>
