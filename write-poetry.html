
<!DOCTYPE html>
<html lang="sd">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شاعري لکو — ڪَويتا</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf0;
      color: #3b2414;
      direction: rtl;
    }

    header {
      background: linear-gradient(135deg, #6b2d2d, #a0522d);
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 18px;
    }

    .container {
      max-width: 750px;
      margin: auto;
      padding: 25px 15px 40px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 16px;
      border: 1px solid #e2c9a5;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    h2 {
      text-align: center;
      color: #6b2d2d;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #5b321c;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #c9a77a;
      border-radius: 9px;
      background: #fffdf8;
      font-size: 17px;
    }

    textarea {
      min-height: 350px;
      resize: vertical;
      line-height: 2.1;
      font-family: Arial, sans-serif;
      direction: rtl;
      text-align: right;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #8b4513;
    }

    .poet-info {
      background: #fff7df;
      border-right: 5px solid #d4a373;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      line-height: 1.9;
    }

    .save-btn {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #6b2d2d;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .save-btn:hover {
      background: #8b4513;
    }

    .back-btn {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #6b2d2d;
      text-decoration: none;
      font-size: 17px;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      background: #edf7ed;
      border-radius: 8px;
      text-align: center;
      color: #285b28;
      font-weight: bold;
    }

    footer {
      background: #3b2414;
      color: white;
      text-align: center;
      padding: 18px;
      font-size: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>اَحساسَن جو ويسُ — ڪَويتا</h1>
  <p>Poetry — The Language of Feelings</p>
</header>

<div class="container">

  <div class="box">

    <h2>شاعري لکو</h2>

    <div class="poet-info">
      <strong>شاعر:</strong>
      <span id="poetName">—</span>
      <br>

      <strong>تخلص:</strong>
      <span id="penName">—</span>
      <br>

      <strong>شاعري جو قسم:</strong>
      <span id="poetryType">—</span>
    </div>

    <form id="poetryForm">

      <label for="title">
        شاعريءَ جو عنوان
      </label>

      <input
        type="text"
        id="title"
        placeholder="مثال: منهنجي سنڌ"
        required
      >

      <label for="type">
        شاعريءَ جو قسم
      </label>

      <select id="type" required>

        <option value="">
          چونڊيو
        </option>

        <option value="غزل — Ghazal">
          غزل — Ghazal
        </option>

        <option value="گيت — Geet">
          گيت — Geet
        </option>

        <option value="نظم — Nazam">
          نظم — Nazam
        </option>

        <option value="بيت — Bet">
          بيت — Bet
        </option>

        <option value="سترنگو — Satrango">
          سترنگو — Satrango
        </option>

        <option value="وائي — Waai">
          وائي — Waai
        </option>

        <option value="نثري نظم — Nasri Nazam">
          نثري نظم — Nasri Nazam
        </option>

        <option value="تجريدي نظم — Tajredi Nazam">
          تجريدي نظم — Tajredi Nazam
        </option>

        <option value="هائيڪو — Haiku">
          هائيڪو — Haiku
        </option>

        <option value="ٻيا — Other">
          ٻيا — Other
        </option>

      </select>

      <label for="poem">
        پنهنجي شاعري لکو
      </label>

      <textarea
        id="poem"
        placeholder="هتي پنهنجي شاعري لکو..."
        required
      ></textarea>

      <button
        type="submit"
        class="save-btn">
        💾 شاعري محفوظ ڪريو
      </button>

    </form>

    <div
      id="message"
      class="message">
      🌹 شاعري ڪاميابي سان محفوظ ٿي وئي!
    </div>

    <a
      href="poets.html"
      class="back-btn">
      ← شاعرن ڏانهن واپس
    </a>

  </div>

</div>

<footer>
  © 2026 ڪَويتا — Poetry App
</footer>

<script>

  const params =
    new URLSearchParams(window.location.search);

  const poetIndex =
    params.get("poet");

  const poets =
    JSON.parse(
      localStorage.getItem("poets") || "[]"
    );

  let poet = null;

  if (
    poetIndex !== null &&
    poets[poetIndex]
  ) {
    poet = poets[poetIndex];
  }

  if (poet) {

    document.getElementById("poetName").textContent =
      poet.name || "—";

    document.getElementById("penName").textContent =
      poet.penName || "—";

    document.getElementById("poetryType").textContent =
      poet.poetryType || "—";

    document.getElementById("type").value =
      poet.poetryType || "";

  }

  const form =
    document.getElementById("poetryForm");

  form.addEventListener("submit", function(event) {

    event.preventDefault();

    const title =
      document.getElementById("title").value.trim();

    const type =
      document.getElementById("type").value;

    const poem =
      document.getElementById("poem").value.trim();

    if (!poet) {
      alert("شاعر جي معلومات موجود ناهي.");
      return;
    }

    const allPoetry =
      JSON.parse(
        localStorage.getItem("poetry") || "[]"
      );

    const newPoetry = {

      poetIndex: Number(poetIndex),

      poetName:
        poet.name || "",

      penName:
        poet.penName || "",

      title:
        title,

      type:
        type,

      poem:
        poem,

      createdAt:
        new Date().toISOString()

    };

    allPoetry.push(newPoetry);

    localStorage.setItem(
      "poetry",
      JSON.stringify(allPoetry)
    );

    document.getElementById("message").style.display =
      "block";

    form.reset();

    document.getElementById("type").value =
      poet.poetryType || "";

    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });

  });

</script>

</body>
</html>
